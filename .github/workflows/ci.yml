name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jazzy:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    env:
      # 0.11.0 から、定義の説明(コメント)と kumu 文書 で API のページが作れる(suru#209)
      SURU_VERSION: v0.11.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: clang と suru を入れる
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang python3-pip git \
            ros-jazzy-example-interfaces ros-jazzy-demo-nodes-cpp ros-jazzy-turtlesim xvfb xauth
          go install github.com/suru-lang/suru/cmd/kumu@${SURU_VERSION}
          pip install --break-system-packages "git+https://github.com/suru-lang/suru@${SURU_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 試験(kumu 試験)
        run: |
          source /opt/ros/jazzy/setup.bash
          kumu 試験

      - name: 点検(kumu 点検)
        run: |
          source /opt/ros/jazzy/setup.bash
          kumu 点検

      - name: CDR の往復の試験(同梱した型を全部 rclpy と往復させる)
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 test/cdr_roundtrip.py

      - name: 相互運用の試験(C++・ros2 CLI・launch・QoS・インタプリタ)
        run: |
          source /opt/ros/jazzy/setup.bash
          SURU=suru test/interop.sh

      - name: turtlesim の試験(examples/亀)
        run: |
          source /opt/ros/jazzy/setup.bash
          SURU=suru test/turtle.sh

      - name: サービスの試験(examples/足し算サーバー・足し算クライアント と demo_nodes_cpp)
        run: |
          source /opt/ros/jazzy/setup.bash
          SURU=suru test/add_two_ints.sh

      - name: アクションの試験(examples/フィボナッチサーバー・フィボナッチクライアント)
        run: |
          source /opt/ros/jazzy/setup.bash
          SURU=suru test/fibonacci.sh

  docs:
    # Read the Docs と同じ手順で文書を作れるか確かめる(.readthedocs.yaml の pre_build と同じ kumu を使う)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: API のページを作る(kumu 文書)
        run: |
          v=$(sed -n 's|.*releases/download/v\([0-9.]*\)/.*|\1|p' .readthedocs.yaml | head -1)
          curl -sSfL "https://github.com/suru-lang/suru/releases/download/v${v}/suru-${v}-linux-amd64.tar.gz" | tar -xz -C /tmp
          "/tmp/suru-${v}-linux-amd64/kumu" 文書 --出力 docs/api

      - name: Sphinx で HTML にする(警告も失敗にする)
        run: |
          pip install -r docs/requirements.txt
          sphinx-build -W docs docs/_build
